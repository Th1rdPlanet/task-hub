name: Request a server-build change
description: Изменить конфигурацию, плагин или состав серверной сборки
title: "[Build]: "
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: "Не публикуйте пароли, токены, ключи, персональные данные или закрытые логи."
  - type: textarea
    id: change
    attributes:
      label: Какое изменение требуется?
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Зачем оно требуется?
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Конфигурация, плагин или компонент
      description: Если неизвестно, оставьте поле пустым.
  - type: textarea
    id: verification
    attributes:
      label: Как проверить результат?
    validations:
      required: true


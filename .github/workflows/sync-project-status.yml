name: Sync Project status to issues

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: project-issue-status-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Synchronize issue labels and state
        run: node scripts/sync-project-status.mjs
        env:
          GH_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN }}
          PROJECT_OWNER: Th1rdPlanet
          PROJECT_NUMBER: '1'
